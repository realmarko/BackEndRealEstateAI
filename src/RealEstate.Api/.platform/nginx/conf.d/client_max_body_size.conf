# Elastic Beanstalk's default nginx reverse proxy caps request bodies at 1M, far below what the
# app's own listing/agent/brokerage photo upload UI promises (up to 20 photos x 5MB each, plus
# multipart overhead and the listing's other form fields) — every upload of more than one or two
# real photos was failing with "413 Content Too Large" before nginx ever handed the request to
# Kestrel. 110M covers the documented 20x5MB limit with headroom for multipart boundaries/fields;
# PhotoUploadService's own per-file 5MB check is still the real limit enforced on each photo, this
# just stops nginx from rejecting a multi-photo request before that check ever runs.
client_max_body_size 110M;
