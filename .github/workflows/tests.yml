name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore RealEstate.sln

      - name: Build
        run: dotnet build RealEstate.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test RealEstate.sln --no-build --configuration Release --logger "console;verbosity=normal"
